<!DOCTYPE html>
<html lang="en">
<head>
<title>six seven</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
}
.center {
    display: flex;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    align-items: center;
    height: 100vh;
}

.flipped {
    transform: scaleX(-1);
}

#shrugcat{
    padding: 20px 0px 20px 0px;
}
</style>

<script>
    let count = 0
    function flip() {
        const img = document.getElementById("shrugcat")
        const counter = document.getElementById("count")

        img.classList.toggle("flipped");
        count++;

        counter.innerHTML = "Count: " + count;
    }
</script>

</head>
<body>
<div class="center">
    <h1>67 Simulator</h1>
    <p id="count">Count: 0</p>

    <img id="shrugcat" src="/devportfolio/cat_shrug.png" alt="shrugging cat">
    <button onclick="flip()">six seven</button>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<title>six seven</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
}
.center {
    display: flex;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    align-items: center;
    height: 100vh;
}

.flipped {
    transform: scaleX(-1);
}

#shrugcat{
    padding: 20px 0px 20px 0px;
}
</style>

<!-- confetti effect -->
<script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4/tsparticles.confetti.bundle.min.js"></script>

</head>

<body>
<div class="center">
    <h1>67 Simulator</h1>
    <p id="count">Count: 0</p>

    <img id="shrugcat" src="/devportfolio/cat_shrug.png" alt="shrugging cat">
    <button onclick="flip()">six seven</button>
</div>

<script>
    let count = 0
    function flip() {
        const img = document.getElementById("shrugcat")
        const counter = document.getElementById("count")

        img.classList.toggle("flipped");
        count++;

        counter.innerHTML = "Count: " + count;

        if (count === 67) {
            confetti(
                {
                "count": 80,
                "spread": 55,
                "angle": 90,
                "startVelocity": 45,
                "gravity": 10,
                "zIndex": 10,
                "colors": [
                    "#ff577f",
                    "#ffd166",
                    "#06d6a0",
                    "#4cc9f0"
                ],
                "position": {
                    "x": 50,
                    "y": 50
                }
                }
            );
        }
    }
</script>

</body>
</html>
